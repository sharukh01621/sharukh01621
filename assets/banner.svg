<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Mezanur Rahman Sharukh — Statistician, Public Health and Machine Learning Researcher">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2447"/>
      <stop offset="55%" stop-color="#1B3B6F"/>
      <stop offset="100%" stop-color="#0F5C6E"/>
    </linearGradient>
    <linearGradient id="curve1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#5EEAD4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="curve2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="250" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="248" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Subtle statistical grid & twin Gaussian curves on right -->
  <g opacity="0.12" stroke="#E2E8F0" stroke-width="1">
    <line x1="760" y1="205" x2="1150" y2="205"/>
    <line x1="820" y1="55" x2="820" y2="205" stroke-dasharray="3 5"/>
    <line x1="910" y1="55" x2="910" y2="205" stroke-dasharray="3 5"/>
    <line x1="1000" y1="55" x2="1000" y2="205" stroke-dasharray="3 5"/>
    <line x1="1090" y1="55" x2="1090" y2="205" stroke-dasharray="3 5"/>
  </g>

  <!-- Twin statistical distribution curves -->
  <path d="M 760 205 C 815 205, 845 72, 910 72 C 975 72, 1005 205, 1060 205" fill="none" stroke="url(#curve1)" stroke-width="2.6"/>
  <path d="M 850 205 C 905 205, 938 92, 1002 92 C 1066 92, 1096 205, 1150 205" fill="none" stroke="url(#curve2)" stroke-width="2.2"/>

  <!-- Minimal neural network nodes overlay -->
  <g stroke="#5EEAD4" stroke-opacity="0.32" stroke-width="1.1">
    <line x1="855" y1="128" x2="910" y2="72"/>
    <line x1="910" y1="72" x2="965" y2="128"/>
    <line x1="910" y1="72" x2="1002" y2="92"/>
    <line x1="965" y1="128" x2="1002" y2="92"/>
    <line x1="1002" y1="92" x2="1055" y2="142"/>
    <line x1="855" y1="128" x2="965" y2="128"/>
  </g>
  <g>
    <circle cx="855" cy="128" r="4" fill="#5EEAD4"/>
    <circle cx="910" cy="72" r="4.5" fill="#F59E0B"/>
    <circle cx="965" cy="128" r="4" fill="#38BDF8"/>
    <circle cx="1002" cy="92" r="4.5" fill="#F59E0B"/>
    <circle cx="1055" cy="142" r="3.8" fill="#5EEAD4"/>
  </g>

  <!-- Left Editorial Typography -->
  <text x="58" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#F59E0B" letter-spacing="2.2">STATISTICS · BIOSTATISTICS · PUBLIC HEALTH AI</text>
  <text x="56" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">Mezanur Rahman Sharukh</text>
  <line x1="58" y1="138" x2="290" y2="138" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <text x="58" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#E2E8F0">Statistician · Public Health &amp; Epidemiology Researcher · Applied ML &amp; PyTorch</text>
  <text x="58" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">Author of "From First Line to First Paper" (860 pp, Zenodo DOI) · Maintainer of sharukh-tutor (PyPI)</text>
</svg>
