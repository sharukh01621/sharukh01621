<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Mezanur Rahman Sharukh — Statistician, Public Health and Machine Learning Researcher">
  <!-- Warm archival paper canvas -->
  <rect x="0.5" y="0.5" width="1199" height="239" rx="12" fill="#f7f4ee" stroke="#1f1b16" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Left editorial typography (4px grid) -->
  <text x="48" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" fill="#70665a">Public Health and ML Researcher</text>
  <text x="48" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="400" fill="#1f1b16" letter-spacing="-0.4">Mezanur Rahman Sharukh</text>

  <line x1="48" y1="132" x2="664" y2="132" stroke="#1f1b16" stroke-opacity="0.12" stroke-width="1"/>

  <text x="48" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e554a">National health surveys, epidemiological modelling, and calibrated clinical AI</text>
  <text x="48" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#70665a">Author of From First Line to First Paper (860 pp, open access) · Maintainer of sharukh-tutor (PyPI)</text>

  <!-- Right statistical distribution plate (Tufte-inspired hairline plot) -->
  <g transform="translate(744, 0)">
    <!-- Subtle reference grid -->
    <line x1="24" y1="184" x2="408" y2="184" stroke="#1f1b16" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="120" y1="48" x2="120" y2="184" stroke="#1f1b16" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="216" y1="48" x2="216" y2="184" stroke="#1f1b16" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="312" y1="48" x2="312" y2="184" stroke="#1f1b16" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Baseline reference density (muted neutral dashed) -->
    <path d="M 88 184 C 144 184, 184 96, 248 96 C 312 96, 344 184, 400 184" fill="none" stroke="#70665a" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Primary density fill & curve (single slate-teal accent) -->
    <path d="M 32 184 C 92 184, 128 60, 192 60 C 256 60, 292 184, 352 184 Z" fill="#0f4c5c" fill-opacity="0.07"/>
    <path d="M 32 184 C 92 184, 128 60, 192 60 C 256 60, 292 184, 352 184" fill="none" stroke="#0f4c5c" stroke-width="2"/>

    <!-- Decision / peak markers -->
    <line x1="192" y1="60" x2="192" y2="184" stroke="#0f4c5c" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="192" cy="60" r="4" fill="#0f4c5c" stroke="#f7f4ee" stroke-width="1.5"/>
    <circle cx="248" cy="96" r="3.5" fill="#70665a" stroke="#f7f4ee" stroke-width="1.5"/>

    <!-- Axis tick marks & mono labels -->
    <line x1="120" y1="184" x2="120" y2="188" stroke="#1f1b16" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="216" y1="184" x2="216" y2="188" stroke="#1f1b16" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="312" y1="184" x2="312" y2="188" stroke="#1f1b16" stroke-opacity="0.25" stroke-width="1"/>

    <text x="120" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#70665a">-1.0</text>
    <text x="216" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#70665a">0.0</text>
    <text x="312" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#70665a">+1.0</text>
  </g>
</svg>
