<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Mezanur Rahman Sharukh — Statistician, Public Health and Machine Learning Researcher">
  <!-- Warm charcoal dark-mode canvas -->
  <rect x="0.5" y="0.5" width="1199" height="239" rx="12" fill="#161513" stroke="#efe9de" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Left editorial typography (4px grid) -->
  <text x="48" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="400" fill="#8f887d">Statistician · Public health and machine learning researcher</text>
  <text x="48" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="400" fill="#efe9de" letter-spacing="-0.4">Mezanur Rahman Sharukh</text>

  <line x1="48" y1="132" x2="664" y2="132" stroke="#efe9de" stroke-opacity="0.12" stroke-width="1"/>

  <text x="48" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#aaa398">National health surveys, epidemiological modelling, and calibrated clinical AI</text>
  <text x="48" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8f887d">Author of From First Line to First Paper (860 pp, open access) · Maintainer of sharukh-tutor (PyPI)</text>

  <!-- Right statistical distribution plate -->
  <g transform="translate(744, 0)">
    <!-- Subtle reference grid -->
    <line x1="24" y1="184" x2="408" y2="184" stroke="#efe9de" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="120" y1="48" x2="120" y2="184" stroke="#efe9de" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="216" y1="48" x2="216" y2="184" stroke="#efe9de" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="312" y1="48" x2="312" y2="184" stroke="#efe9de" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Baseline reference density (muted neutral dashed) -->
    <path d="M 88 184 C 144 184, 184 96, 248 96 C 312 96, 344 184, 400 184" fill="none" stroke="#8f887d" stroke-opacity="0.50" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Primary density fill & curve (single muted slate-teal accent) -->
    <path d="M 32 184 C 92 184, 128 60, 192 60 C 256 60, 292 184, 352 184 Z" fill="#6eb5c4" fill-opacity="0.10"/>
    <path d="M 32 184 C 92 184, 128 60, 192 60 C 256 60, 292 184, 352 184" fill="none" stroke="#6eb5c4" stroke-width="2"/>

    <!-- Decision / peak markers -->
    <line x1="192" y1="60" x2="192" y2="184" stroke="#6eb5c4" stroke-opacity="0.30" stroke-width="1"/>
    <circle cx="192" cy="60" r="4" fill="#6eb5c4" stroke="#161513" stroke-width="1.5"/>
    <circle cx="248" cy="96" r="3.5" fill="#8f887d" stroke="#161513" stroke-width="1.5"/>

    <!-- Axis tick marks & mono labels -->
    <line x1="120" y1="184" x2="120" y2="188" stroke="#efe9de" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="216" y1="184" x2="216" y2="188" stroke="#efe9de" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="312" y1="184" x2="312" y2="188" stroke="#efe9de" stroke-opacity="0.25" stroke-width="1"/>

    <text x="120" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8f887d">-1.0</text>
    <text x="216" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8f887d">0.0</text>
    <text x="312" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8f887d">+1.0</text>
  </g>
</svg>
